(function (root) {
  'use strict';
  const goals = Object.freeze({
    cost: { label: 'ค่าใช้จ่ายต่ำสุด', description: 'เลือกค่าใช้จ่ายรวมต่ำสุด ถ้าเท่ากันเลือกเวลาน้อยกว่า' },
    time: { label: 'ใช้เวลาน้อยสุด', description: 'เลือกเวลารวมน้อยสุด ถ้าเท่ากันเลือกค่าใช้จ่ายต่ำกว่า' },
    balanced: { label: 'สมดุลทั้งสองด้าน', description: 'ให้น้ำหนักค่าใช้จ่าย 50% และเวลา 50%' }
  });
  // Illustrative, comparable initial-inspection services; no real provider or quotation.
  const sampleOptions = Object.freeze([
    Object.freeze({ id: 'A', label: 'บริการตัวอย่าง A', cost: 300, minutes: 120, eligible: true }),
    Object.freeze({ id: 'B', label: 'บริการตัวอย่าง B', cost: 700, minutes: 30, eligible: true }),
    Object.freeze({ id: 'C', label: 'บริการตัวอย่าง C', cost: 450, minutes: 60, eligible: true })
  ]);
  const validGoal = goal => typeof goal === 'string' && Object.prototype.hasOwnProperty.call(goals, goal);
  const goalFor = goal => validGoal(goal) ? goal : 'balanced';
  function rankOptions(options, goal, safety) {
    if (!validGoal(goal)) throw new TypeError('Unknown service goal');
    if (!Array.isArray(options)) throw new TypeError('Options must be an array');
    // A goal can never bypass the safety stop. "no" is still not a driving clearance.
    if (safety !== 'no') return [];
    const eligible = options.filter(o => o && o.eligible === true &&
      Number.isFinite(o.cost) && o.cost >= 0 && Number.isFinite(o.minutes) && o.minutes >= 0);
    if (!eligible.length) return [];
    const minCost = Math.min(...eligible.map(o => o.cost)), maxCost = Math.max(...eligible.map(o => o.cost));
    const minTime = Math.min(...eligible.map(o => o.minutes)), maxTime = Math.max(...eligible.map(o => o.minutes));
    const norm = (value, min, max) => min === max ? 0 : (value - min) / (max - min);
    return eligible.map(o => ({ ...o, score: goal === 'cost' ? o.cost : goal === 'time' ? o.minutes :
      0.5 * norm(o.cost, minCost, maxCost) + 0.5 * norm(o.minutes, minTime, maxTime)
    })).sort((a, b) => a.score - b.score || (goal === 'cost' ? a.minutes - b.minutes : goal === 'time' ? a.cost - b.cost : 0));
  }
  function evaluate(c) {
    const goal = goalFor(c.serviceGoal);
    return { goal, label: goals[goal].label, ranked: rankOptions(sampleOptions, goal, c.safety), source: 'ข้อมูลสมมติสำหรับสาธิต ไม่ใช่ราคาและคิวจริงของอู่' };
  }
  function report(c) {
    const result = evaluate(c);
    const rows = result.ranked.map((o, i) => `${i + 1}. ${o.label}: ${o.cost} บาท / ${o.minutes} นาที`);
    return `เป้าหมายการรับบริการ: ${result.label}\n${result.source}\n${rows.length ? rows.join('\n') : 'งดจัดอันดับบริการ เนื่องจากหยุดด้านความปลอดภัย ให้ติดต่อช่างเพื่อประเมินการช่วยเหลือ'}\nขอบเขตสมมติ: ตรวจเบื้องต้น รวมค่าเคลื่อนย้ายและเวลารอ ไม่รวมค่าซ่อม/อะไหล่\nแบบสมดุลปรับราคาและเวลาเป็นสเกล 0–1 ก่อนรวมคะแนน น้ำหนักด้านละ 50% เลือกคะแนนต่ำสุด\nไม่ใช่การจองบริการหรือการรับรองว่าขับต่อได้`;
  }
  const api = { goals, sampleOptions, validGoal, goalFor, rankOptions, evaluate, report };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.CarwiseServiceGoals = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

function caseRows(list,garage=false){if(!list.length)return `<div class="empty">${icon('file')}<h3>ยังไม่มี${garage?'เคสส่งต่อ':'ประวัติการคัดกรอง'}</h3><p>${garage?'ส่งเคสจากหน้าสรุป หรือนำเข้าไฟล์เคสจากผู้ใช้':'เริ่มจากอาการที่สังเกตได้ แล้วค่อย ๆ เก็บข้อมูลไปด้วยกัน'}</p><button class="btn small" data-action="demo">ลองดูเคสตัวอย่าง ${icon('arrow')}</button></div>`;return `<div class="table-wrap"><table><thead><tr><th>เคส / รถ</th><th>อาการที่แจ้ง</th><th>วันที่</th><th>สถานะ</th><th></th></tr></thead><tbody>${list.map(c=>`<tr><td>${esc(c.vehicle)}<span class="sub">${esc(c.id)}${c.demo?' · ตัวอย่าง':''}</span></td><td>${esc(C.groups[c.category].label)}</td><td>${date(c.created)}</td><td>${pill(c)}</td><td><a class="text-link" href="#${garage?'review':'case'}/${encodeURIComponent(c.id)}">เปิดเคส ↗</a></td></tr>`).join('')}</tbody></table></div>`;}
function home(){shell(`${intro('A LITTLE CLARITY GOES A LONG WAY','เข้าใจอาการรถ ก่อนถึงมือช่าง','เริ่มจากสิ่งที่คุณสังเกตได้ เราช่วยเรียบเรียงข้อมูลให้ชัดเจน',`<button class="btn ghost" data-action="demo">ดูเคสตัวอย่าง ${icon('arrow')}</button>`)}<section class="hero"><div class="hero-copy"><div class="eyebrow"><span class="dot"></span> SMART QUESTIONS. CLEARER ANSWERS.</div><h2>รถมีอาการแปลกไป?<br><em>เริ่มหาคำตอบไปด้วยกัน</em></h2><p>ตอบคำถามง่าย ๆ จากอาการที่พบ<br>รับสรุปข้อมูลที่พร้อมส่งต่อให้ช่าง</p><button class="btn primary" data-action="start" data-category="start">เริ่มคัดกรองอาการ ${icon('arrow')}</button></div><div class="hero-art"><div class="art-grid"></div><div class="hero-orbit"></div><span class="art-label">BUILT AROUND YOUR CAR</span>${carArt}<div class="art-foot"><span>01 / OBSERVE</span><span>02 / UNDERSTAND</span><span>03 / CONNECT</span></div></div></section><div class="workflow"><div class="flow-step"><span class="flow-num">01</span><div><h3>คุณเล่าอาการ</h3><p>ไม่จำเป็นต้องมีความรู้ด้านช่าง</p></div><span class="flow-arrow">→</span></div><div class="flow-step"><span class="flow-num">02</span><div><h3>ระบบช่วยคัดกรอง</h3><p>ถามต่อจากข้อมูลที่คุณบอก</p></div><span class="flow-arrow">→</span></div><div class="flow-step"><span class="flow-num">03</span><div><h3>ส่งต่อให้ช่างเข้าใจ</h3><p>สรุปอาการเพื่อประกอบการตรวจ</p></div></div></div>${draft?`<div class="alert soft">${icon('clock')}<div>คุณมีการคัดกรองที่ยังไม่เสร็จ <button class="text-link" data-action="resume">ทำต่อจากเดิม →</button></div></div>`:''}<a href="#tuners" class="tg-entry"><div><div class="eyebrow">NEW CATEGORY / TUNERSGATE</div><h2>ของแต่งจากญี่ปุ่น ในหมวดใหม่ของคุณ</h2><p>เลือกยี่ห้อรถ ค้นหาอะไหล่ และดูต้นทุนนำเข้าแบบสาธิต</p><span class="text-link">สำรวจอะไหล่นำเข้า ↗</span></div><span class="tg-entry-mark" aria-hidden="true">TG<span>JAPAN → THAILAND</span></span></a><section class="goal-home"><div><div class="eyebrow">NEW / CHOOSE YOUR GOAL</div><h2>ประหยัดที่สุด เร็วที่สุด หรือสมดุลทั้งสองด้าน</h2><p>เลือกเป้าหมายของคุณ แล้วเปรียบเทียบค่าใช้จ่ายและเวลาในหน้าสรุปเคส · ข้อมูลบริการสมมติสำหรับสาธิต</p></div><button class="btn dark" data-action="demo">ลองเปรียบเทียบ 3 เป้าหมาย →</button></section><div class="section-title"><h2>วันนี้รถของคุณมีอาการแบบไหน?</h2><span>เลือกอาการหลัก 1 ข้อ</span></div><div class="dashboard-grid"><div class="symptom-grid">${Object.entries(C.groups).map(([id,g])=>`<button class="symptom" data-action="start" data-category="${id}">${icon(g.icon)}<span class="arrow">↗</span><h3>${g.label}</h3><p>${g.desc}</p></button>`).join('')}</div><aside class="note-card"><div><div class="badge-icon">${icon('shield')}</div><h3>ความปลอดภัย<br>มาก่อนคำตอบ</h3><p>ไม่แน่ใจ ตอบ “ไม่ทราบ” ได้เสมอ<br>ระบบจะหยุดเมื่อข้อมูลไม่พอ<br>และส่งต่อให้ช่างตรวจจริง</p></div><a href="#method" class="text-link">รู้จักขอบเขตของระบบ ↗</a></aside></div><section class="recent"><div class="section-title"><h2>การคัดกรองล่าสุด</h2><a class="text-link" href="#history">ดูประวัติทั้งหมด →</a></div>${caseRows(cases.slice(0,3))}</section>`);}
function start(category){if(draft){go('intake');toast('เปิดแบบร่างเดิมให้แล้ว หากต้องการเริ่มใหม่ ใช้ปุ่มล้างแบบร่าง');return;}draft={category,vehicle:'',year:'',context:'',serviceGoal:'balanced',answers:[],safety:null,stage:'intake'};persist();go('intake');}
function intake(){if(!draft){go('home');return;}shell(`${intro('LET’S START WITH YOUR CAR','บอกเราเกี่ยวกับรถของคุณ','ข้อมูลเท่าที่ทราบก็พอ ไม่ต้องระบุชื่อหรือข้อมูลส่วนตัว')}<div class="layout"><section class="panel"><div class="progress"><i class="on"></i><i></i><i></i></div><h2>ข้อมูลรถและอาการ</h2><p>เราจะใช้ข้อมูลนี้ประกอบสรุปส่งต่อให้ช่าง</p><form id="intake-form"><div class="form-grid"><label class="field"><span>ยี่ห้อ / รุ่นรถ <span class="required">*</span></span><input name="vehicle" maxlength="100" required placeholder="เช่น Toyota Yaris หรือ Honda Click" value="${esc(draft.vehicle)}"></label><label class="field">ปีรถ (ถ้าทราบ)<input name="year" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="เช่น 2020" value="${esc(draft.year)}"><small>ใช้ปี ค.ศ. หรือเว้นว่าง</small></label><label class="field full">อาการหลัก<select name="category">${Object.entries(C.groups).map(([id,g])=>`<option value="${id}" ${draft.category===id?'selected':''}>${g.label}</option>`).join('')}</select></label><label class="field full">เล่าเหตุการณ์ที่เกิดขึ้น<textarea name="context" maxlength="2000" placeholder="เกิดเมื่อไหร่ กำลังทำอะไร และมีสิ่งใดต่างจากปกติ">${esc(draft.context)}</textarea><small>ไม่ต้องลองทำให้เกิดอาการซ้ำเพื่อกรอกข้อมูล</small></label><div class="field full">${goalPicker(draft.serviceGoal)}</div></div><div class="actions"><a href="#home" class="btn ghost">กลับหน้าหลัก</a><button class="btn dark" type="submit">ถัดไป: ความปลอดภัย ${icon('arrow')}</button></div></form></section><aside class="aside-card"><div class="tiny-label">BEFORE WE BEGIN</div><h3>คุณรู้จักอาการ เราช่วยเรียบเรียง</h3><p>ใช้เวลาประมาณ 2–3 นาที<br>ตอบได้จากสิ่งที่เคยสังเกต ไม่ต้องใช้เครื่องมือหรือทดลองซ่อมรถ</p><div class="divider"></div><ul><li>ตอบ “ไม่ทราบ” ได้</li><li>หยุดและส่งต่อได้ทุกขั้นตอน</li><li>ไม่มีการยืนยันชิ้นส่วนเสีย</li></ul><div class="divider"></div><button class="text-link" data-action="reset-draft">ล้างแบบร่างและเริ่มใหม่</button>${draft.answers.length?'<button class="btn small" data-action="resume">กลับไปคำถามที่ค้างไว้</button>':''}</aside></div>`,'home','เริ่มคัดกรอง');$('#intake-form').addEventListener('input',()=>{const f=new FormData($('#intake-form'));draft.vehicle=f.get('vehicle');draft.year=f.get('year');draft.context=f.get('context');draft.serviceGoal=G.goalFor(f.get('serviceGoal'));persist()});$('#intake-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(!String(f.get('vehicle')).trim()){toast('กรุณาระบุยี่ห้อหรือรุ่นรถ');return;}if(draft.category!==f.get('category'))draft.answers=[];Object.assign(draft,{vehicle:String(f.get('vehicle')).trim(),year:f.get('year'),context:f.get('context'),serviceGoal:G.goalFor(f.get('serviceGoal')),category:f.get('category'),stage:'safety'});persist();go('safety')});}
function safety(){if(!draft?.vehicle){go('intake');return;}shell(`${intro('SAFETY FIRST','ก่อนเริ่ม ขอเช็กความปลอดภัย','ตอบจากสถานการณ์ที่พบ ไม่ต้องตรวจหรือทดลองเพิ่มเติม')}<div class="layout"><section class="panel"><div class="progress"><i class="on"></i><i class="on"></i><i></i></div><div class="question-label">SAFETY CHECK / ไม่ใช้คะแนน HEURISTIC</div><h2 class="question-title">มีสิ่งที่ทำให้คุณรู้สึกว่า<br>สถานการณ์อาจไม่ปลอดภัยหรือไม่?</h2><p>เช่น มีควัน กลิ่นไหม้รุนแรง ควบคุมรถผิดปกติ หรือมีเหตุที่ไม่มั่นใจ</p><div class="options"><button class="option" data-action="safety" data-answer="yes"><span>มีสัญญาณที่น่ากังวล</span><span class="circle"></span></button><button class="option" data-action="safety" data-answer="no"><span>ไม่พบจากสิ่งที่สังเกตได้</span><span class="circle"></span></button><button class="option unknown" data-action="safety" data-answer="unknown"><span>ไม่แน่ใจ / ประเมินไม่ได้</span><span class="circle"></span></button></div><a href="#intake" class="text-link">← กลับไปแก้ข้อมูลรถ</a></section><aside class="aside-card">${icon('shield')}<h3 style="margin-top:18px">ไม่แน่ใจ หยุดไว้ก่อนได้</h3><p>ถ้าพบความเสี่ยงหรือประเมินไม่ได้ ระบบจะไม่ถามต่อ และสร้างสรุปเพื่อให้คุณขอความช่วยเหลือจากช่าง</p><p>การตอบว่าไม่พบสัญญาณ ไม่ใช่การรับรองว่ารถปลอดภัยหรือขับต่อได้</p></aside></div>`,'home','ตรวจความปลอดภัย');}
function questioning(){if(!draft?.vehicle){go('intake');return;}if(draft.safety!=='no'){go('safety');return;}const reason=C.shouldStop(draft.safety,draft.answers);if(reason){finish(reason);return;}const q=C.next(draft.category,draft.answers);if(!q){finish('ไม่มีคำถามที่เหมาะสมเพิ่มเติม');return;}shell(`${intro('ONE QUESTION AT A TIME','ค่อย ๆ ทำความเข้าใจอาการ','เลือกคำตอบจากสิ่งที่จำได้ ไม่ต้องทดลองกับรถ')}<div class="layout"><section class="panel"><div class="progress">${Array.from({length:4},(_,i)=>`<i class="${i<=draft.answers.length?'on':''}"></i>`).join('')}</div><div class="question-label">QUESTION ${String(draft.answers.length+1).padStart(2,'0')} / สูงสุด 4 คำถาม</div><h2 class="question-title">${q.text}</h2><p>${q.hint}</p><div class="options">${[...q.options,'ไม่ทราบ'].map(a=>`<button class="option ${a==='ไม่ทราบ'?'unknown':''}" data-action="answer" data-answer="${esc(a)}"><span>${a}</span><span class="circle"></span></button>`).join('')}</div><div class="actions">${draft.answers.length?`<button class="btn ghost" data-action="undo">${icon('back')} แก้คำตอบก่อนหน้า</button>`:''}<button class="btn danger" data-action="stop">หยุดคัดกรองและส่งต่อ</button></div></section><aside class="aside-card"><div class="tiny-label">HEURISTIC IN ACTION</div><h3>ทำไมถึงถามข้อนี้?</h3><p>ระบบเลือกคำถามที่เหมาะกับข้อมูลปัจจุบันและตอบได้ง่ายก่อน</p><div class="math">h(n) = S × E / (R + 1)</div><div class="metric"><span>ความเกี่ยวข้องกับข้อมูล · S</span><strong>${q.S}</strong></div><div class="metric"><span>ความง่ายในการตอบ · E</span><strong>${q.E}</strong></div><div class="metric"><span>ความเสี่ยงของคำถาม · R</span><strong>${q.R}</strong></div><div class="metric"><span>คะแนนจัดลำดับคำถาม</span><strong>${q.score}</strong></div><p>คะแนนตัวอย่างเพื่อสาธิตอัลกอริทึม ไม่ใช่เปอร์เซ็นต์ความแม่นยำ</p><a class="text-link" href="#method">ดูหลักการทำงาน ↗</a></aside></div>`,'home','คัดกรองอาการ');}
function finish(reason){const c={id:'CW-'+Date.now().toString(36).toUpperCase(),vehicle:draft.vehicle,year:draft.year,context:draft.context,category:draft.category,serviceGoal:G.goalFor(draft.serviceGoal),answers:[...draft.answers],safety:draft.safety||'unknown',created:new Date().toISOString(),reason,status:'draft',mechanic:{}};cases.unshift(c);draft=null;persist();go('case/'+c.id);}

function goalPicker(value,caseId){
  const selected=G.goalFor(value);
  return `<fieldset class="goal-picker"><legend>เป้าหมายการรับบริการ</legend><p>เลือกสิ่งที่คุณให้ความสำคัญ เปลี่ยนได้อีกครั้งในหน้าสรุป</p><div class="goal-grid">${Object.entries(G.goals).map(([id,g])=>`<label class="goal-card"><input type="radio" name="serviceGoal" value="${id}" ${selected===id?'checked':''} ${caseId!==undefined?`data-service-case="${esc(caseId)}"`:''}><span><strong>${g.label}</strong><small>${g.description}</small></span></label>`).join('')}</div></fieldset>`;
}
function serviceSummary(c,review){
  const r=G.evaluate(c),best=r.ranked[0];
  const tied=best?r.ranked.filter(o=>Math.abs(o.score-best.score)<1e-10&&(r.goal==='balanced'||(r.goal==='cost'?o.minutes===best.minutes:o.cost===best.cost))):[];
  return `<section class="summary-section service-goals" id="service-goals"><h3>04 / เป้าหมายและทางเลือกรับบริการ</h3><span class="pill warn">ข้อมูลสมมติสำหรับสาธิต</span>${review?`<p><strong>เป้าหมายผู้ใช้: ${esc(r.label)}</strong></p>`:goalPicker(r.goal,c.id)}<p>เปรียบเทียบบริการตรวจเบื้องต้นขอบเขตเดียวกัน: ราคาและเวลารวมการเคลื่อนย้าย การรอ และการตรวจในสถานการณ์สมมติ ไม่รวมค่าซ่อมและอะไหล่ ไม่มีข้อมูลอู่จริงหรือการจองบริการ</p>${!best?'<div class="alert">งดจัดอันดับบริการ เนื่องจากหยุดด้านความปลอดภัย ให้ติดต่อช่างเพื่อประเมินการช่วยเหลือ ไม่เลือกวิธีเดินทางจากราคาและเวลา</div>':`<div class="goal-result" role="status"><div class="tiny-label">${esc(r.label)} · ผลเปรียบเทียบตัวอย่าง</div><h3>${tied.map(o=>esc(o.label)).join(' / ')}${tied.length>1?' — คะแนนเท่ากัน':''}</h3><p>${r.goal==='cost'?'ค่าใช้จ่ายต่ำสุดในชุดนี้ หากเท่ากันเลือกเวลาน้อยกว่า':r.goal==='time'?'เวลารวมน้อยสุดในชุดนี้ หากเท่ากันเลือกค่าใช้จ่ายต่ำกว่า':'คะแนนรวมต่ำสุด หลังปรับราคาและเวลาเป็นสเกลเดียวกัน น้ำหนักด้านละ 50%'}</p></div><div class="table-wrap"><table class="service-table"><caption class="sr-only">เปรียบเทียบบริการตัวอย่างตามเป้าหมาย ${esc(r.label)}</caption><thead><tr><th scope="col">ลำดับ / บริการ</th><th scope="col">ค่าใช้จ่ายรวม</th><th scope="col">เวลารวม</th>${r.goal==='balanced'?'<th scope="col">คะแนนรวม ↓</th>':''}</tr></thead><tbody>${r.ranked.map((o,i)=>`<tr class="${tied.includes(o)?'goal-best':''}"><td>${i+1}. ${esc(o.label)}${tied.includes(o)?'<span class="sub">เหมาะกับเป้าหมายที่เลือก</span>':''}</td><td>${o.cost.toLocaleString('th-TH')} บาท</td><td>${o.minutes} นาที</td>${r.goal==='balanced'?`<td>${o.score.toFixed(3)}</td>`:''}</tr>`).join('')}</tbody></table></div><p>แบบสมดุลอาจไม่ได้ถูกที่สุดหรือเร็วที่สุดพร้อมกัน คะแนนต่ำดีกว่า ไม่ใช่เปอร์เซ็นต์ความแม่นยำ และไม่เปลี่ยนข้อสงสัยเกี่ยวกับอาการรถ</p>`}<p>การเลือกเป้าหมายไม่ใช่การรับรองว่ารถขับต่อได้ ช่างยังต้องตรวจรถจริงและยืนยันค่าบริการ</p></section>`;
}

function summary(c,review=false){const ranked=C.rank(c.category,c.answers),unsafe=c.safety!=='no';return `<div class="summary-head"><div><div class="case-id">${esc(c.id)} ${c.demo?' / DEMO CASE':''}</div><h2 style="margin-top:10px">${esc(c.vehicle)} ${esc(c.year||'')}</h2><p>${esc(C.groups[c.category].label)} · ${date(c.created)}</p></div>${pill(c)}</div><div class="alert ${unsafe?'':'soft'}">${icon(unsafe?'alert':'shield')}<div><strong>${unsafe?'หยุดการคัดกรอง · ขอความช่วยเหลือจากช่าง':'ข้อมูลคัดกรองเบื้องต้น พร้อมให้ช่างตรวจต่อ'}</strong>${esc(c.reason)}<br>ข้อมูลนี้ไม่ใช่ผลวินิจฉัย และไม่ยืนยันว่าขับต่อได้</div></div><section class="summary-section"><h3>01 / ข้อมูลจากผู้ใช้</h3><dl class="keyvals"><dt>อาการหลัก</dt><dd>${esc(C.groups[c.category].label)}</dd><dt>เหตุการณ์</dt><dd>${esc(c.context||'ไม่ได้ระบุ')}</dd><dt>ความปลอดภัย</dt><dd>${c.safety==='yes'?'ผู้ใช้รายงานสัญญาณที่น่ากังวล':c.safety==='unknown'?'ผู้ใช้ไม่มั่นใจ / ประเมินไม่ได้':'ผู้ใช้ไม่พบสัญญาณน่ากังวลจากที่สังเกต (ยังไม่ได้ตรวจยืนยัน)'}</dd></dl><div class="evidence">${c.answers.map(a=>`<div class="evidence-item">${esc(a.question)}<br><strong>${esc(a.answer)}</strong><small>ผู้ใช้รายงาน${a.score!==undefined?' · คะแนนคำถามขณะเลือก '+esc(a.score):''}</small></div>`).join('')||'<p>หยุดก่อนเริ่มคำถามเพิ่มเติม</p>'}</div></section><section class="summary-section"><h3>02 / ข้อสงสัยของระบบ</h3><p>ใช้เป็นจุดเริ่มต้นสำหรับการตรวจ ไม่ยืนยันว่าระบบหรือชิ้นส่วนใดเสีย</p>${unsafe||!c.answers.some(a=>a.answer!=='ไม่ทราบ')?'<div class="alert">งดจัดลำดับสาเหตุ เนื่องจากต้องหยุดคัดกรองหรือไม่มีข้อมูลเพียงพอ</div>':ranked.map((r,i)=>`<div class="rank"><span class="rank-num">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(r.label)}</h3><p>${r.reasons.length?'ข้อมูลประกอบ: '+esc([...new Set(r.reasons)].join(' · ')):'ยังไม่มีข้อมูลเฉพาะสนับสนุน ต้องตรวจเพิ่มเติม'}</p></div></div>`).join('')}<p>ลำดับมาจากกฎตัวอย่างในโปรเจกต์ ไม่ใช่ผลประเมินทางช่างที่ผ่านการรับรอง</p></section><section class="summary-section"><h3>03 / สิ่งที่ยังไม่ทราบ</h3><p>${c.answers.filter(a=>a.answer==='ไม่ทราบ').map(a=>esc(a.question)).join('<br>')||'ไม่มีคำตอบ “ไม่ทราบ” ในคำถามที่ตอบ'}</p><p>ส่วนคัดกรองนี้ไม่มีผลตรวจรถจริงหรือค่าตรวจวัด ผลที่ช่างบันทึกจะแสดงแยกต่างหาก${c.answers.length<4?' · คำถามที่ยังไม่ได้ถามไม่ถูกตีความว่าไม่มีอาการ':''}</p></section>${serviceSummary(c,review)}${!review&&c.mechanic?.diagnosis?`<section class="summary-section"><h3>05 / บันทึกของช่าง</h3><dl class="keyvals"><dt>ผู้บันทึก</dt><dd>${esc(c.mechanic.name)}</dd><dt>สิ่งที่ตรวจ</dt><dd>${esc(c.mechanic.inspected)}</dd><dt>ผลตรวจ</dt><dd>${esc(c.mechanic.diagnosis)}</dd><dt>แผนดำเนินการ</dt><dd>${esc(c.mechanic.plan)}</dd></dl><p>บันทึกโดยผู้ใช้พื้นที่ช่างในเว็บต้นแบบนี้ ยังไม่มีการยืนยันตัวตนผู้บันทึก</p></section>`:''}`;}
function casePage(id){const c=cases.find(c=>c.id===id);if(!c){notFound();return;}shell(`<a class="back" href="#history">${icon('back')} ประวัติการคัดกรอง</a>${intro('DIAGNOSTIC SUMMARY','เรื่องราวอาการรถ ในที่เดียว','แยกข้อมูลที่พบ ข้อสงสัย และสิ่งที่ยังต้องตรวจให้ชัดเจน',`<button class="btn ghost" data-action="print">${icon('print')} พิมพ์สรุป</button>`)}<div class="layout"><article class="panel">${summary(c)}</article><aside class="aside-card"><div class="tiny-label">THE NEXT STEP</div><h3>ส่งต่อข้อมูลให้ช่าง</h3><p>เคสในเว็บนี้เก็บอยู่บนเบราว์เซอร์ของคุณ ส่งเข้าพื้นที่ช่างเพื่อทดลอง หรือดาวน์โหลดไฟล์เพื่อนำไปเปิดบนอีกเครื่อง</p><div class="stack">${c.status==='draft'?`<button class="btn dark" data-action="handoff" data-id="${esc(c.id)}">ส่งเข้าพื้นที่ช่าง ${icon('arrow')}</button>`:`<a class="btn dark" href="#review/${encodeURIComponent(c.id)}">เปิดในพื้นที่ช่าง ${icon('arrow')}</a>`}<button class="btn" data-action="txt" data-id="${esc(c.id)}">${icon('download')} ดาวน์โหลดสรุป .txt</button><button class="btn" data-action="json" data-id="${esc(c.id)}">${icon('download')} ส่งออกไฟล์เคส .json</button></div><div class="divider"></div><p>ไฟล์เคสเปิดผ่านปุ่ม “นำเข้าเคส” ในพื้นที่ช่างได้ ไม่มีการส่งข้อมูลไปอู่ภายนอกโดยอัตโนมัติ</p><a class="text-link" href="#home">กลับไปหน้าหลัก →</a></aside></div>`,'history','สรุปอาการ');}
function listing(garage){const list=cases.filter(c=>!garage||c.status!=='draft');shell(`${intro(garage?'WORKSHOP SPACE':'YOUR CAR JOURNAL',garage?'ข้อมูลพร้อม ช่างเริ่มได้ชัดเจน':'ประวัติการคัดกรอง',garage?'รับข้อมูลอาการ ตรวจรถจริง และบันทึกผลในมุมมองของช่าง':'ทุกอาการ ทุกคำตอบ และข้อมูลที่ส่งต่อ เก็บไว้ที่นี่',garage?`<button class="btn dark" data-action="import">${icon('upload')} นำเข้าเคส</button>`:`<a class="btn dark" href="#home">${icon('plus')} คัดกรองใหม่</a>`)}${garage?`<div class="stats"><div class="stat"><span>รอช่างรับเคส</span><strong>${list.filter(c=>c.status==='queued').length}</strong></div><div class="stat"><span>กำลังตรวจ</span><strong>${list.filter(c=>c.status==='reviewing').length}</strong></div><div class="stat"><span>บันทึกผลแล้ว</span><strong>${list.filter(c=>c.status==='completed').length}</strong></div></div><div class="alert soft">${icon('tool')}<div>พื้นที่สาธิตบทบาทช่างบนเครื่องเดียวกัน · ช่างต้องตรวจรถจริงก่อนสรุปผล<br>ยังไม่มีบัญชีผู้ใช้หรือระบบตรวจสอบตัวตนช่าง</div></div>`:''}<div class="toolbar"><label class="sr-only" for="case-search">ค้นหารถหรือรหัสเคส</label><input id="case-search" class="search" placeholder="ค้นหารถหรือรหัสเคส…" value="${esc(query)}"><div class="filter">${[['all','ทั้งหมด'],['queued','รอรับเคส'],['reviewing','กำลังตรวจ'],['completed','บันทึกผลแล้ว']].map(([v,l])=>`<button class="chip ${filter===v?'active':''}" data-action="filter" data-filter="${v}">${l}</button>`).join('')}</div></div><div id="case-table"></div><input type="file" id="import-file" accept=".json,application/json" hidden>` ,garage?'garage':'history',garage?'พื้นที่ช่าง':'ประวัติ');const update=()=>{$('#case-table').innerHTML=caseRows(list.filter(c=>(filter==='all'||c.status===filter)&&(c.vehicle+' '+c.id).toLowerCase().includes(query.toLowerCase())),garage);bind($('#case-table'))};update();$('#case-search').addEventListener('input',e=>{query=e.target.value;update()});$('#import-file').addEventListener('change',importCase);}
function review(id){const c=cases.find(c=>c.id===id);if(!c){notFound();return;}if(c.status==='draft'){go('case/'+id);return;}const m=c.mechanic||{};shell(`<a class="back" href="#garage">${icon('back')} กลับพื้นที่ช่าง</a>${intro('WORKSHOP / CASE DETAIL','ตรวจจากข้อมูล ยืนยันจากรถจริง','ข้อสงสัยของระบบเป็นเพียงข้อมูลประกอบ การวินิจฉัยเป็นหน้าที่ช่าง')}<div class="layout"><article class="panel">${summary(c,true)}</article><aside class="panel"><div class="tiny-label">MECHANIC’S NOTES</div><h2>บันทึกการตรวจ</h2><p>กรอกผลจากการตรวจจริง ไม่คัดลอกข้อสงสัยของระบบเป็นข้อสรุป</p>${c.status==='queued'?`<button class="btn dark" style="width:100%;margin-bottom:20px" data-action="accept" data-id="${esc(id)}">รับเคสนี้ ${icon('check')}</button>`:''}<form id="mechanic-form"><div class="stack"><label class="field">ชื่อผู้บันทึก<input name="name" maxlength="100" required value="${esc(m.name||'')}" placeholder="ชื่อช่าง / ผู้ทดสอบ"></label><label class="field">สิ่งที่ตรวจและหลักฐาน<textarea name="inspected" maxlength="3000" required placeholder="ระบุสิ่งที่ตรวจจริงและผลที่ได้">${esc(m.inspected||'')}</textarea></label><label class="field">ผลตรวจ / ข้อวินิจฉัย<textarea name="diagnosis" maxlength="3000" required placeholder="ระบุผลตรวจ หรือสิ่งที่ยังยืนยันไม่ได้">${esc(m.diagnosis||'')}</textarea></label><label class="field">แผนดำเนินการต่อ<textarea name="plan" maxlength="3000" required placeholder="ขั้นตอนถัดไปที่แจ้งผู้ใช้">${esc(m.plan||'')}</textarea></label><label class="field">สถานะ<select name="status"><option value="reviewing" ${c.status==='reviewing'?'selected':''}>กำลังตรวจ</option><option value="completed" ${c.status==='completed'?'selected':''}>บันทึกผลตรวจแล้ว</option></select></label><button type="submit" class="btn dark">บันทึกผลตรวจ ${icon('check')}</button><button type="button" class="btn" data-action="json" data-id="${esc(id)}">${icon('download')} ส่งออกเคสที่อัปเดต</button></div></form><p>ข้อมูลในมุมมองผู้ใช้จะอัปเดตหลังบันทึก</p></aside></div>`,'garage','รายละเอียดเคส');$('#mechanic-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);if(['name','inspected','diagnosis','plan'].some(k=>!String(f.get(k)).trim())){toast('กรุณากรอกข้อมูลผลตรวจให้ครบ');return;}c.mechanic={name:f.get('name'),inspected:f.get('inspected'),diagnosis:f.get('diagnosis'),plan:f.get('plan'),updated:new Date().toISOString()};c.status=f.get('status');persist();render();toast('บันทึกผลตรวจแล้ว ผู้ใช้เปิดดูได้ในหน้าสรุปเคส')});}
function method(){shell(`${intro('TRANSPARENT BY DESIGN','ทุกคำถาม มีเหตุผลที่เลือก','ดูวิธีทำงานของ Heuristic Search และขอบเขตของเว็บต้นแบบ')}<div class="method-grid"><section class="panel"><div class="eyebrow">01 / SEARCH PROCESS</div><h2>จากอาการ สู่ข้อมูลส่งต่อ</h2><ol class="numbered"><li>รับข้อมูลรถ อาการหลัก และบริบท</li><li>ตรวจ Safety gate หากเสี่ยงหรือไม่แน่ใจ ให้หยุดทันที</li><li>จัดอันดับคำถามที่ยังไม่ได้ตอบด้วย h(n)</li><li>รับคำตอบ บันทึกหลักฐาน และปรับคะแนนคำถามถัดไป</li><li>หยุดเมื่อครบ 4 คำถาม ตอบไม่ทราบ 2 ข้อ หรือผู้ใช้ขอหยุด</li><li>สรุปข้อมูลและส่งให้ช่างตรวจจริง</li></ol></section><section class="panel"><div class="eyebrow">02 / HEURISTIC FUNCTION</div><h2>เลือกคำถามที่เหมาะก่อน</h2><div class="math">h(n) = S × E / (R + 1)</div><p><strong>S · ความเกี่ยวข้อง</strong><br>คะแนนตัวอย่าง 1–5 ปรับตามอาการและคำตอบก่อนหน้า</p><p><strong>E · ความง่ายในการตอบ</strong><br>คะแนน 1–5 เลือกคำถามที่ตอบจากความจำได้</p><p><strong>R · ความเสี่ยงของขั้นตอน</strong><br>คำถามในต้นแบบนี้ไม่ให้ทดลองกับรถ จึงกำหนดเป็น 0 และใช้ Safety gate แยกต่างหาก</p></section><section class="panel"><div class="eyebrow">03 / HONEST LIMITS</div><h2>คะแนนไม่ใช่ผลวินิจฉัย</h2><p>เว็บใช้กฎและคะแนนตัวอย่างแบบกำหนดไว้ ไม่ได้เรียก AI หรือใช้ฐานข้อมูลรถจริง คะแนนแสดงความสำคัญในการเลือกคำถาม ไม่ใช่โอกาสที่ชิ้นส่วนเสีย</p><p>ใช้การเลือกคำถามแบบ greedy: เลือกคะแนนสูงสุดในแต่ละรอบ ไม่รับประกันคำตอบที่เหมาะที่สุด และไม่ได้อ้างว่าเป็น A*</p><p>“ไม่ทราบ” จะเก็บเป็นข้อมูลที่ขาด ไม่ตีความว่าไม่มีอาการ กลุ่มสาเหตุยังคงอยู่เพื่อให้ช่างตรวจต่อ</p><a class="text-link" href="https://inst.eecs.berkeley.edu/~cs188/textbook/search/informed.html" target="_blank" rel="noopener">อ้างอิงหลักการ Informed Search · UC Berkeley ↗</a></section><section class="panel"><div class="eyebrow">04 / YOUR DATA</div><h2>ข้อมูลอยู่กับคุณ</h2><p>เคสและแบบร่างเก็บใน localStorage ของเบราว์เซอร์นี้ ไม่มีเซิร์ฟเวอร์รับข้อมูล ไม่มีระบบล็อกอิน และไม่ส่งเคสไปอู่จริง</p><p>ล้างข้อมูลเบราว์เซอร์แล้วข้อมูลจะหาย ส่งออกไฟล์ .json เพื่อสำรองหรือย้ายไปอีกเครื่อง และใช้ .txt เพื่ออ่านหรือส่งต่อให้ช่าง</p><p>ก่อนใช้งานกับลูกค้าจริง ต้องมีฐานความรู้ที่ช่างตรวจรับรอง การทดสอบความปลอดภัย ระบบบัญชี และการจัดเก็บข้อมูลที่เหมาะสม</p></section><section class="panel"><div class="eyebrow">05 / SERVICE GOALS</div><h2>เป้าหมาย 3 แบบ</h2><p>ประหยัดที่สุด เลือกค่าใช้จ่ายรวมต่ำสุด · เร็วที่สุด เลือกเวลารวมน้อยสุด · สมดุล ให้น้ำหนักทั้งสองด้านเท่ากัน</p><p>แบบสมดุลปรับราคาและเวลาเป็นสเกล 0–1 ด้วย (ค่า − ค่าน้อยสุด) / (ค่ามากสุด − ค่าน้อยสุด) หากทุกตัวเลือกมีค่าเท่ากัน ให้ด้านนั้นเป็น 0 แล้วรวมด้านละ 50% เลือกคะแนนต่ำสุด</p><p>เป็นการเปรียบเทียบบริการตัวอย่างในชุดเดียวกัน แยกจากคะแนนเลือกคำถามและข้อสงสัยของระบบ ยังไม่มีราคา คิว หรือการจองกับอู่จริง หากหยุดด้านความปลอดภัย ระบบจะงดจัดอันดับบริการ</p></section></div>${draft?'<div class="actions"><button class="btn dark" data-action="resume">กลับไปคัดกรองต่อ →</button></div>':''}`,'method','วิธีทำงาน');}

function asText(c){return `CARWISE — Diagnostic Summary\nข้อมูลคัดกรอง ไม่ใช่ผลวินิจฉัย\n\nเคส: ${c.id}${c.demo?' (ตัวอย่าง)':''}\nรถ: ${c.vehicle} ${c.year||''}\nวันที่: ${date(c.created)}\nอาการ: ${C.groups[c.category].label}\nเหตุการณ์: ${c.context||'ไม่ระบุ'}\nความปลอดภัย: ${c.safety==='no'?'ผู้ใช้ไม่พบสัญญาณน่ากังวล แต่ยังไม่ได้ตรวจยืนยัน':c.safety==='yes'?'ผู้ใช้รายงานสัญญาณน่ากังวล':'ผู้ใช้ไม่แน่ใจ'}\n\nคำตอบของผู้ใช้\n${c.answers.map(a=>a.question+'\n→ '+a.answer).join('\n\n')}\n\nเหตุผลที่หยุด: ${c.reason}\n\nข้อสงสัยของระบบ (กฎตัวอย่าง ไม่ยืนยันชิ้นส่วนเสีย)\n${c.safety==='no'&&c.answers.some(a=>a.answer!=='ไม่ทราบ')?C.rank(c.category,c.answers).map((r,i)=>`${i+1}. ${r.label} — ${r.reasons.join(', ')||'ยังไม่มีข้อมูลสนับสนุนเฉพาะ'}`).join('\n'):'งดจัดลำดับสาเหตุ'}\n\nสิ่งที่ยังไม่ทราบ\n${c.answers.filter(a=>a.answer==='ไม่ทราบ').map(a=>a.question).join('\n')}\nยังไม่มีผลตรวจจริง/ค่าตรวจวัดจากช่างในส่วนคัดกรอง\n\n${G.report(c)}\n\nบันทึกของช่าง\n${c.mechanic?.diagnosis?`ผู้บันทึก: ${c.mechanic.name}\nสิ่งที่ตรวจ: ${c.mechanic.inspected}\nผลตรวจ: ${c.mechanic.diagnosis}\nแผน: ${c.mechanic.plan}`:'ยังไม่มีบันทึก'}\n\nสถานะ: ${stateName[c.status]}\nต้นแบบนี้ไม่มีการยืนยันตัวตนช่าง ไม่รับรองว่ารถปลอดภัยหรือขับต่อได้\n`;}
async function importCase(e){const file=e.target.files[0];if(!file)return;if(file.size>200000){toast('ไฟล์ใหญ่เกินกำหนด 200 KB');return;}try{const data=JSON.parse(await file.text());if(data.format!=='carwise-case-v1'||!C.validCase(data.case))throw Error();const c=data.case;const existing=cases.findIndex(x=>x.id===c.id);if(existing>=0&&!window.confirm('พบรหัสเคสเดิม ต้องการแทนที่ด้วยข้อมูลจากไฟล์นี้หรือไม่? ควรส่งออกเคสเดิมไว้ก่อน'))return;const imported={id:c.id,vehicle:c.vehicle,year:String(c.year||'').slice(0,4),category:c.category,created:c.created,context:String(c.context||'').slice(0,2000),answers:c.answers.map(a=>({id:a.id,question:a.question,answer:a.answer,score:Number.isFinite(a.score)?a.score:undefined})),safety:c.safety,reason:c.reason,serviceGoal:G.goalFor(c.serviceGoal),status:'queued',mechanic:{},demo:!!c.demo};if(c.mechanic&&typeof c.mechanic==='object'){for(const k of ['name','inspected','diagnosis','plan','updated'])if(typeof c.mechanic[k]==='string')imported.mechanic[k]=c.mechanic[k].slice(0,3000);if(imported.mechanic.diagnosis)imported.status=c.status==='completed'?'completed':'reviewing';}if(existing>=0)cases[existing]=imported;else cases.unshift(imported);persist();go('review/'+imported.id);toast('นำเข้าเคสแล้ว')}catch{toast('อ่านไฟล์ไม่ได้ กรุณาเลือกไฟล์เคส .json ที่ส่งออกจาก Carwise')}finally{e.target.value='';}}

  $('#tg-quote-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);tgConfig=TG.config({fx:Number(f.get('fx')),tax:Number(f.get('tax')),mode:f.get('mode')});const destination=$('#tg-checkout-form input[name="destination"]').value,confirmed=$('#tg-checkout-form input[name="confirmed"]').checked;tgSave();tgCartPage();$('#tg-checkout-form input[name="destination"]').value=destination;$('#tg-checkout-form input[name="confirmed"]').checked=confirmed;toast('อัปเดตประมาณการแล้ว')});
  $('#tg-checkout-form').addEventListener('input',e=>{const f=new FormData(e.currentTarget);tgCheckout={destination:String(f.get('destination')||''),confirmed:f.get('confirmed')==='on'}});
  $('#tg-checkout-form').addEventListener('submit',e=>{e.preventDefault();const estimate=$('#tg-quote-form');if(!estimate.reportValidity())return;const pending=new FormData(estimate);if(Number(pending.get('fx'))!==tgConfig.fx||Number(pending.get('tax'))!==tgConfig.tax||pending.get('mode')!==tgConfig.mode){toast('กรุณากดคำนวณประมาณการใหม่ก่อนสร้างคำสั่งซื้อ');return}try{const f=new FormData(e.target),o=TG.makeOrder(tgCart,tgConfig,f.get('destination'),f.get('confirmed')==='on',new Date().toISOString(),'TG-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,5).toUpperCase());tgOrders.unshift(o);tgCart=[];tgCheckout={destination:'',confirmed:false};const saved=tgSave();go('parts-order/'+o.id);toast(saved?'สร้างคำสั่งซื้อจำลองแล้ว ไม่มีการเรียกเก็บเงิน':'สร้างในหน่วยความจำแล้ว แต่บันทึกถาวรไม่ได้ กรุณาส่งออกสรุป')}catch(err){toast(err.message)}});
}
function tgOrdersPage(){tgShell(`<div class="section-title"><h2>คำสั่งซื้อของคุณ</h2><span>${tgOrders.length} คำสั่งซื้อจำลอง</span></div>${tgOrders.length?`<div class="tg-orders">${tgOrders.map(o=>`<a class="panel tg-order-row" href="#parts-order/${encodeURIComponent(o.id)}"><div><span class="tiny-label">${esc(o.id)}</span><h3>${esc(o.destination)}</h3><p>${date(o.created)} · ${o.quote.lines.length} รายการ · ฿${tgMoney(o.quote.total)}</p></div><span class="pill">${TG.stages[o.stage]}</span><span>ดูสถานะ ↗</span></a>`).join('')}</div>`:'<div class="empty tg-empty"><h2>ยังไม่มีคำสั่งซื้อจำลอง</h2><p>เลือกสินค้าและสร้างคำสั่งซื้อจากตะกร้าเพื่อทดลองติดตามสถานะ</p><a class="btn dark" href="#tuners">เริ่มเลือกอะไหล่</a></div>'}`,'orders')}
function tgOrderPage(id){const o=tgOrders.find(x=>x.id===id);if(!o){tgShell('<div class="empty"><h2>ไม่พบคำสั่งซื้อในเครื่องนี้</h2><a class="btn" href="#parts-orders">ดูคำสั่งซื้อทั้งหมด</a></div>','orders');return}
  tgShell(`<a class="back" href="#parts-orders">← คำสั่งซื้อทั้งหมด</a><div class="tg-checkout"><section class="panel"><div class="summary-head"><div><div class="tiny-label">${esc(o.id)}</div><h2>ติดตามจากญี่ปุ่น ถึงปลายทาง</h2></div><span class="pill warn">สถานะจำลอง</span></div><p>ปลายทาง: ${esc(o.destination)} · ${date(o.created)}</p><ol class="tg-timeline">${TG.stages.map((name,i)=>`<li class="${i<=o.stage?'done':''}"><span>${i<o.stage?'✓':i+1}</span><div><h3>${name}</h3><p>${i===o.stage?'สถานะปัจจุบัน (จำลอง)':i<o.stage?'ผ่านขั้นตอนแล้ว (จำลอง)':'รอดำเนินการ'}${o.events.find(e=>e.stage===i)?' · '+date(o.events.find(e=>e.stage===i).at):''}</p></div></li>`).join('')}</ol><div class="actions">${o.stage<TG.stages.length-1?`<button class="btn dark" data-tg="advance" data-order="${esc(o.id)}">จำลองสถานะถัดไป →</button>`:'<span class="pill">จบการสาธิตการจัดส่ง</span>'}<button class="btn" data-tg="export" data-order="${esc(o.id)}">ดาวน์โหลดสรุป .txt</button></div><p>ปุ่มนี้เปลี่ยนสถานะตัวอย่างในเครื่อง ไม่มีการติดต่อซัพพลายเออร์ ขนส่ง หรือศุลกากรจริง</p></section><aside class="panel"><h2>รายการและต้นทุนที่บันทึก</h2>${o.quote.lines.map(l=>`<div class="tg-order-item"><strong>${esc(l.name)}</strong><p>${esc(l.id)} × ${l.qty} · ฿${tgMoney(l.total)}</p></div>`).join('')}${tgTotals(o.quote)}<p>บันทึกประมาณการ ณ เวลาสร้างคำสั่งซื้อ การแก้เรทในตะกร้าภายหลังไม่เปลี่ยนยอดนี้</p><span class="pill neutral">ไม่มีการชำระเงิน</span></aside></div>`,'orders')}
function tgSearchPage(){
 const A=window.TunersSearch;
 tgShell(`${intro('HEURISTIC SEARCH / INTERACTIVE LAB','ค้นหาเส้นทางที่เหมาะกับเป้าหมาย','A* Search · ผู้ใช้เลือกอะไหล่ → ระบบค้นหาเส้นทาง → ส่งถึงอู่ให้ช่างตรวจความเข้ากันได้')}<div class="tg-lab-states"><div><span>01 / PROBLEM</span><h3>เลือกแหล่งซื้อและขนส่งอย่างไร?</h3><p>ราคาถูกอาจรอนาน ต้องเทียบเส้นทางครบ ไม่ดูแค่ราคาสินค้า</p></div><div><span>02 / START STATE</span><h3>ยังไม่เลือกเส้นทาง</h3><p>อะไหล่ 1 ชิ้น งบและเป้าหมายที่เลือก · cost = 0, days = 0</p></div><div><span>03 / GOAL STATE</span><h3>ได้แผนส่งถึงอู่ภายในงบ</h3><p>ผ่านผู้ขาย → ขนส่งระหว่างประเทศ → ส่งถึงอู่ และได้คะแนนต่ำสุด</p></div></div><form id="tg-search-form" class="panel"><div class="tg-filter-grid"><label class="field">อะไหล่สำหรับค้นหา<select name="part">${TG.products.map(p=>`<option value="${p.id}" ${tgLab.part===p.id?'selected':''}>${esc(p.name)}${p.stock?'':' (ไม่มีสต็อก)'}</option>`).join('')}</select></label><label class="field">เป้าหมายค้นหา<select name="goal">${Object.entries(A.goals).map(([id,label])=>`<option value="${id}" ${tgLab.goal===id?'selected':''}>${label}</option>`).join('')}</select></label><label class="field">งบรวมสูงสุด (บาท)<input name="budget" type="number" min="0" max="100000000" step="0.01" placeholder="ไม่จำกัดงบ" value="${esc(tgLab.budget)}"></label><button class="btn primary" type="submit">ค้นหาด้วย A* →</button></div><p class="tg-disclaimer">ชุดสถานการณ์ Search Lab แยกจากตะกร้า: ผู้ขายสมมติ 3 ราย × ขนส่ง 2 แบบ × ส่งถึงอู่ 2 แบบ = 12 เส้นทาง · จำนวน 1 ชิ้น · เรทคงที่ ¥1 = ฿0.25 · ภาษีสมมติ ฿800</p></form><div id="tg-search-result"></div><details class="panel tg-lab-explain"><summary>Heuristic Function และวิธีค้นหา</summary><p>State = (ขั้นตอน, เส้นทางที่เลือก, ค่าใช้จ่ายสะสม, วันสะสม) · แต่ละเส้นทางเป็นคนละ state เพื่อไม่ตัดแผนที่ยังอยู่ในงบทิ้งผิดพลาด</p><p>g(n) = wC × cost_so_far / 5000 + wT × days_so_far / 30<br>h(n) = wC × min_remaining_cost / 5000 + wT × min_remaining_days / 30<br><strong>f(n) = g(n) + h(n) เลือกค่าน้อยสุดจาก OPEN</strong></p><p>ค่าใช้จ่ายต่ำสุดใช้ (wC,wT) = (1,0) · เวลาน้อยสุด (0,1) · สมดุล (0.5,0.5) · 5000 บาทและ 30 วันเป็นสเกลคงที่ของแบบจำลอง ไม่ใช่ค่า min-max ของตัวเลือก</p><p>h รวมค่าต่ำสุดของแต่ละขั้นตอนที่ยังเหลือ แยกฝั่งราคาและวัน จึงอาจมาจากคนละตัวเลือกและไม่เกินต้นทุนจริงที่ต้องจ่ายต่อ เมื่อถึงเป้าหมาย h = 0 หาก cost สะสม + ราคาต่ำสุดที่ยังเหลือเกินงบจะตัดเส้นทางนั้น</p><p>ต้นไม้มีความลึก 3 ไม่มีวงวน ค่า edge ไม่ติดลบ ใช้ A* tree search และหยุดเมื่อดึง goal จาก OPEN จึงได้คะแนนดีที่สุดใน 12 เส้นทางสมมติ หากคะแนนเท่ากันใช้ลำดับสร้างก่อน ไม่รับรองผลนอกชุดข้อมูลนี้</p><p>อ้างอิงหลักการ <a class="text-link" href="https://inst.eecs.berkeley.edu/~cs188/textbook/search/informed.html" target="_blank" rel="noopener">UC Berkeley CS188 — Informed Search ↗</a></p></details>`,'search');
 $('#tg-search-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);tgLab={part:f.get('part'),goal:f.get('goal'),budget:f.get('budget')};tgLabResult=A.search(tgLab);tgLabStep=1;tgSearchResult()});
 $('#tg-search-form').addEventListener('input',()=>{tgLabResult=null;$('#tg-search-result').innerHTML='<p class="tg-disclaimer" role="status">ค่าเปลี่ยนแล้ว กดค้นหาเพื่อดูผลใหม่</p>'});
 if(tgLabResult)tgSearchResult();
}
function tgSearchResult(){const r=tgLabResult;if(!r)return;const A=window.TunersSearch,rows=A.enumerate(tgLab),n=r.trace[Math.min(tgLabStep,r.trace.length)-1],best=r.best;
 $('#tg-search-result').innerHTML=`<section class="panel tg-lab-result"><div class="tiny-label">${r.status==='found'?'GOAL REACHED':r.status==='out-of-stock'?'NO STOCK':'NO FEASIBLE ROUTE'}</div><h2>${best?'แผนที่ค้นพบ: '+best.path.map(x=>esc(x.label)).join(' → '):r.status==='out-of-stock'?'สินค้าไม่มีสต็อกจำลอง':'ไม่มีเส้นทางที่อยู่ภายในงบ'}</h2><div class="tg-lab-metrics"><div><small>รวมประมาณการ</small><strong>${best?'฿'+tgMoney(best.cost):'—'}</strong></div><div><small>เวลารวมสมมติ</small><strong>${best?best.days+' วัน':'—'}</strong></div><div><small>คะแนนเป้าหมาย ↓</small><strong>${best?best.g.toFixed(4):'—'}</strong></div><div><small>ขยาย / สร้างโหนด</small><strong>${r.expanded} / ${r.generated}</strong></div></div><p>นี่คือแผนคำนวณสาธิต ไม่มีการสั่งซื้อจริง และไม่ได้ยืนยันว่าสินค้าติดตั้งกับรถได้</p><button class="btn" data-tg="export-search">ดาวน์โหลดผล Search .json</button></section>${n?`<section class="panel tg-lab-trace"><div class="section-title"><h2>ดูการค้นหาทีละขั้น</h2><span>ขั้น ${tgLabStep} / ${r.trace.length}</span></div><div class="actions"><button class="btn" data-tg="trace-prev" ${tgLabStep<=1?'disabled':''}>← ก่อนหน้า</button><button class="btn primary" data-tg="trace-next" ${tgLabStep>=r.trace.length?'disabled':''}>ขั้นถัดไป →</button><button class="btn" data-tg="trace-all">ดูครบทุกขั้น</button></div><p><strong>${esc(n.path)}</strong><br>g = ${n.g.toFixed(4)} · h = ${n.h.toFixed(4)} · f = ${n.f.toFixed(4)} · OPEN หลังดำเนินการ = ${n.open}<br>${n.action==='goal'?'พบ Goal และหยุดค้นหา':n.action==='budget-pruned'?'ตัดออก: แม้ใช้ราคาต่ำสุดที่เหลือก็เกินงบ':'ขยายโหนด สร้างลูก '+n.children+' โหนด'}</p><div class="table-wrap"><table><caption>ลำดับโหนดที่ A* ดึงออกจาก OPEN</caption><thead><tr><th>ขั้น</th><th>เส้นทาง</th><th>g</th><th>h</th><th>f</th><th>การทำงาน</th></tr></thead><tbody>${r.trace.slice(0,tgLabStep).map(t=>`<tr><td>${t.step}</td><td>${esc(t.path)}</td><td>${t.g.toFixed(4)}</td><td>${t.h.toFixed(4)}</td><td>${t.f.toFixed(4)}</td><td>${t.action}</td></tr>`).join('')}</tbody></table></div></section>`:''}<details class="panel tg-lab-explain"><summary>ผลลัพธ์ครบ ${rows.length} เส้นทาง สำหรับเงื่อนไขนี้</summary><p>ตารางนี้ไล่ครบทุกเส้นทางเพื่อใช้ตรวจคำตอบ แยกจากขั้นตอน A* ด้านบน แถวเกินงบไม่มีสิทธิ์เป็นคำตอบ</p><div class="table-wrap"><table><thead><tr><th>เส้นทาง</th><th>บาท</th><th>วัน</th><th>คะแนน ↓</th><th>เงื่อนไขงบ</th></tr></thead><tbody>${rows.map(t=>`<tr><td>${t.path.map(x=>esc(x.label)).join(' → ')}</td><td>${tgMoney(t.cost)}</td><td>${t.days}</td><td>${t.score.toFixed(4)}</td><td>${t.eligible?'อยู่ในงบ':'เกินงบ'}</td></tr>`).join('')}</tbody></table></div></details>`;tgBind($('#tg-search-result'));
}
function tgBind(root=document){root.querySelectorAll('[data-tg]').forEach(b=>b.addEventListener('click',()=>{
  const a=b.dataset.tg,p=TG.get(b.dataset.part),row=p&&tgCart.find(x=>x.id===p.id);
  if(a==='trace-next'||a==='trace-prev'||a==='trace-all'){tgLabStep=a==='trace-all'?tgLabResult.trace.length:Math.max(1,Math.min(tgLabResult.trace.length,tgLabStep+(a==='trace-next'?1:-1)));tgSearchResult();return}
  if(a==='export-search'&&tgLabResult){download('TunersGate-search.json',JSON.stringify({inputs:tgLab,result:tgLabResult,allRoutes:window.TunersSearch.enumerate(tgLab),demo:true},null,2),'application/json');return}

  if(a==='effects'){tgEffects=!tgEffects;tgPreferences();document.body.classList.toggle('tg-calm',!tgEffects);b.setAttribute('aria-pressed',tgEffects);b.textContent=tgEffects?'เอฟเฟกต์: เปิด':'เอฟเฟกต์: ปิด';return}
  if(a==='browse'){$('#tg-catalog').scrollIntoView({behavior:tgEffects&&!matchMedia('(prefers-reduced-motion: reduce)').matches?'smooth':'auto'});$('#tg-filter-form input[name="search"]').focus({preventScroll:true});return}
  if(a==='my-car'){const car=TG.products.find(p=>p.model===tgGarage);if(car){tgFilter={...tgEmptyFilter(),brand:car.brand,model:car.model};tgCatalog();$('#tg-catalog').scrollIntoView()}return}
  if(a==='clear'){tgFilter=tgEmptyFilter();tgCatalog();$('#tg-catalog').scrollIntoView();return}
  if(a==='save'&&p){tgSaved=tgSaved.includes(p.id)?tgSaved.filter(id=>id!==p.id):[...tgSaved,p.id];tgPreferences();if(location.hash==='#parts-saved')tgSavedPage();else tgSync();toast(tgSaved.includes(p.id)?'บันทึกในรายการโปรดแล้ว':'นำออกจากรายการโปรดแล้ว');return}
  if(a==='compare'&&p){if(!tgCompare.includes(p.id)&&tgCompare.length>=3){toast('เปรียบเทียบได้สูงสุด 3 ชิ้น นำชิ้นเดิมออกก่อน');return}tgCompare=tgCompare.includes(p.id)?tgCompare.filter(id=>id!==p.id):[...tgCompare,p.id];tgPreferences();if(location.hash==='#parts-compare')tgComparePage();else tgSync();return}
  if(a==='clear-compare'){tgCompare=[];tgPreferences();if(location.hash==='#parts-compare')tgComparePage();else tgSync();return}
  if(a==='shipping'){const form=$('#tg-quote-form');if(!form.reportValidity())return;const f=new FormData(form);tgConfig=TG.config({fx:Number(f.get('fx')),tax:Number(f.get('tax')),mode:b.dataset.mode});tgSave();tgCartPage();toast('คำนวณใหม่ตามวิธีขนส่งที่เลือกแล้ว');return}

  if(['add','plus'].includes(a)&&p){if(!p.stock||row&&row.qty>=p.stock){toast('ถึงจำนวนสต็อกจำลองแล้ว');return}if(row)row.qty++;else tgCart.push({id:p.id,qty:1});tgSave();if(a==='plus')tgCartPage();else{document.querySelectorAll('.tg-subnav a[href="#parts-cart"] span').forEach(n=>n.textContent=tgCart.reduce((n,x)=>n+x.qty,0));toast('เพิ่ม '+p.name+' แล้ว')}return}
  if(a==='minus'&&row){row.qty=Math.max(1,row.qty-1);tgSave();tgCartPage();return}
  if(a==='remove'&&p){tgCart=tgCart.filter(x=>x.id!==p.id);tgSave();tgCartPage();return}
  const o=tgOrders.find(x=>x.id===b.dataset.order);
  if(a==='advance'&&o){tgOrders=tgOrders.map(x=>x.id===o.id?TG.advance(x):x);tgSave();tgOrderPage(o.id)}
  if(a==='export'&&o)download(o.id+'.txt','\uFEFFTUNERSGATE — คำสั่งซื้อจำลอง / ไม่มีการชำระเงิน\n'+o.id+'\nปลายทาง: '+o.destination+'\nสถานะจำลอง: '+TG.stages[o.stage]+'\n\n'+o.quote.lines.map(l=>l.id+' '+l.name+' × '+l.qty+' = '+l.total+' บาท').join('\n')+'\n\nสินค้า: '+o.quote.goods+' บาท\nขนส่ง: '+o.quote.shipping+' บาท\nภาษี/ค่าธรรมเนียมสมมติ: '+o.quote.tax+' บาท\nรวมประมาณการ: '+o.quote.total+' บาท\nข้อมูลสมมติ ไม่ใช่ใบเสนอราคาหรือคำสั่งซื้อจริง','text/plain;charset=utf-8');
}));}
render();

</script></body></html>
